<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV Multiview</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e12;
    --panel: #12161c;
    --line: #232a33;
    --text: #e6eaf0;
    --muted: #8b95a3;
    --accent: #4cc2ff;
    --ok: #3ddc84;
    --bad: #ff5c5c;
    --warn: #f5b83d;
    --head-h: 52px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    flex: none;
    min-height: var(--head-h);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    transition: margin-top .25s ease;
  }
  body.idle header { margin-top: calc(-1 * (var(--head-h) + 20px)); }
  body.idle { cursor: none; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1 1 auto; }
  .group { display: flex; align-items: center; gap: 4px; }
  button, .btn {
    appearance: none;
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    min-height: 30px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover, .btn:hover { border-color: #3a4552; background: #181e26; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pager { font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; color: var(--muted); }

  /* ---------- Grid ---------- */
  main { flex: 1 1 auto; min-height: 0; position: relative; }
  #grid {
    position: absolute;
    inset: 0;
    display: grid;
    gap: 3px;
    padding: 3px;
  }
  .tile {
    position: relative;
    margin: 0;
    min-width: 0;
    min-height: 0;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  cam-player { display: block; width: 100%; height: 100%; }
  cam-player video { object-fit: contain; background: #000; }
  .bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: linear-gradient(#000c, #0000);
    pointer-events: none;
    font-size: 12px;
  }
  .bar .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .tile[data-state="live"] .dot { background: var(--ok); }
  .tile[data-state="down"] .dot { background: var(--bad); }
  .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; pointer-events: auto; }
  .tile:hover .actions, .tile:focus-within .actions { opacity: 1; }
  .actions button, .actions .btn-mini { padding: 2px 8px; min-height: 24px; background: #000a; font-size: 12px; }
  .actions .btn-mini { color: var(--text); border: 1px solid var(--line); border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; }
  .actions .btn-mini:hover { border-color: #3a4552; background: #181e26; }
  .msg {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--muted);
    pointer-events: none;
    font-size: 13px;
    text-align: center;
    padding: 8px;
  }
  .tile[data-state="live"] .msg { display: none; }
  .tile[data-state="down"] .msg { color: var(--bad); }

  /* ---------- Empty / error ---------- */
  #notice {
    position: absolute; inset: 0;
    display: none;
    place-items: center;
    padding: 24px;
    text-align: center;
  }
  #notice.show { display: grid; }
  #notice .box { max-width: 520px; }
  #notice h2 { margin: 0 0 8px; font-size: 18px; }
  #notice p { margin: 0 0 12px; color: var(--muted); }
  code { background: #1a2029; padding: 1px 6px; border-radius: 4px; font-size: 13px; }

  /* ---------- Viewer (tile diperbesar) ---------- */
  #viewer {
    position: fixed; inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    background: #000f;
  }
  #viewer.show { display: flex; }
  #viewer .vbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #viewer .vbar .name { font-weight: 600; }
  #viewer .vbody { flex: 1 1 auto; min-height: 0; position: relative; }
  #viewer .vbody cam-player { position: absolute; inset: 0; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }


  /* ---------- PTZ ---------- */
  .ptz {
    position: absolute; right: 16px; bottom: 16px; z-index: 2;
    background: #12161cd9; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; display: grid; gap: 8px; width: 200px; backdrop-filter: blur(4px);
  }
  .ptz[hidden] { display: none; }
  .ptz .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .ptz .pad button { justify-content: center; padding: 0; min-height: 40px; font-size: 16px; touch-action: none; user-select: none; }
  .ptz .pad button:active, .ptz .row button:active { background: #243040; border-color: var(--accent); }
  .ptz .row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .ptz .row button { justify-content: center; touch-action: none; user-select: none; }
  .ptz label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .ptz input, .ptz select, #mapview input, #mapview select {
    font: inherit; color: var(--text); background: #181e26; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; min-height: 28px; min-width: 0;
  }
  .ptz input[type=number] { width: 64px; }
  .ptz .pst { display: flex; gap: 4px; align-items: center; }
  .ptz .err { color: var(--bad); font-size: 12px; min-height: 16px; }

  /* ---------- Peta denah ---------- */
  #mapview { position: fixed; inset: 0; z-index: 11; display: none; flex-direction: column; background: #000f; }
  #mapview.show { display: flex; }
  #mapview .vbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #mapview .vbar[hidden], #mapview [hidden] { display: none !important; }
  #mapstage { flex: 1 1 auto; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 12px; }
  #mapwrap { position: relative; display: inline-block; line-height: 0; }
  #mapimg { max-width: 100%; max-height: calc(100vh - 130px); display: block; user-select: none; -webkit-user-drag: none; }
  #mapwrap.edit { cursor: crosshair; }
  .mk {
    position: absolute; transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: 5px; line-height: 1.2;
    background: #12161cf0; border: 1px solid var(--accent); color: var(--text);
    border-radius: 999px; padding: 3px 9px 3px 7px; font-size: 12px; white-space: nowrap;
    cursor: pointer; touch-action: none;
  }
  .mk i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: block; }
  .mk:hover { background: #1d2733; }
  .mk.sel { border-color: var(--warn); }
  .mk.sel i { background: var(--warn); }
  #mapmsg { color: var(--muted); font-size: 12px; }
  #mapmsg.err { color: var(--bad); }
  #mapempty { color: var(--muted); padding: 24px; text-align: center; }

  /* ---------- Mode layar (CctvViewer: ?screen=N) ---------- */
  body.wall header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    transform: translateY(0); transition: transform .25s ease;
  }
  body.wall.idle header { transform: translateY(-110%); margin-top: 0; }
  body.wall main { flex: 1 1 100%; }
  body.wall #layouts, body.wall #pager, body.wall #fs { display: none; }
  .wallonly { display: none; }
  body.wall .wallonly { display: inline-flex; }
  #pbview { position: fixed; inset: 0; z-index: 12; display: none; flex-direction: column; background: #000f; }
  #pbview.show { display: flex; }
  #pbview iframe { flex: 1 1 auto; min-height: 0; border: 0; background: #0b0e12; width: 100%; }

  @media (max-width: 640px) {
    header { padding: 8px 10px; gap: 8px 10px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1 id="title">CCTV Multiview</h1>
  <span class="meta" id="count"></span>
  <span class="spacer"></span>

  <div class="group" id="layouts" role="group" aria-label="Layout">
    <button data-layout="auto" aria-pressed="false" title="Layout otomatis (A)">Auto</button>
    <button data-layout="1" aria-pressed="false" title="1 × 1 (1)">1×1</button>
    <button data-layout="2" aria-pressed="false" title="2 × 2 (2)">2×2</button>
    <button data-layout="3" aria-pressed="false" title="3 × 3 (3)">3×3</button>
    <button data-layout="4" aria-pressed="false" title="4 × 4 (4)">4×4</button>
  </div>

  <div class="group" id="pager">
    <button id="prev" aria-label="Halaman sebelumnya" title="Sebelumnya (←)">‹</button>
    <span class="pager" id="pageInfo">1/1</span>
    <button id="next" aria-label="Halaman berikutnya" title="Berikutnya (→)">›</button>
    <button id="rotate" aria-pressed="false" title="Pindah halaman otomatis (Spasi)">Otomatis</button>
  </div>

  <div class="group">
    <a id="nvr" class="btn" target="_blank" rel="noopener" hidden title="Buka web NX510 untuk playback rekaman">Playback NVR</a>
    <a id="setup" class="btn" target="_blank" rel="noopener" hidden data-title="Registrasi NVR dan daftar kamera" title="Daftarkan NVR dan atur kamera">Kamera NVR</a>
    <button id="mapbtn" hidden title="Peta denah">Peta</button>
    <button id="fs" title="Layar penuh (F)">Layar penuh</button>
    <button id="reload" class="wallonly" title="Muat ulang layar ini (F5)">Muat ulang</button>
    <button id="panelbtn" class="wallonly" title="Buka panel kontrol CctvViewer (pengaturan, registrasi NVR)">Panel</button>
    <button id="quit" class="wallonly" title="Tutup aplikasi CctvViewer (semua layar)">Keluar</button>
  </div>

  <span class="meta hide-sm" id="clock"></span>
</header>

<main>
  <div id="grid"></div>
  <div id="notice"><div class="box"></div></div>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Tampilan kamera diperbesar">
  <div class="vbar">
    <span class="dot" id="vdot"></span>
    <span class="name" id="vname"></span>
    <span class="badge" id="vquality"></span>
    <span class="group" id="vfe" hidden role="group" aria-label="Tampilan fisheye">
      <button data-fe="raw" aria-pressed="false" title="Gambar lingkaran asli">Asli</button>
      <button data-fe="view" aria-pressed="false" title="Tampilan terarah: seret untuk menggeser, roda mouse untuk zoom">Terarah</button>
      <button data-fe="pano" aria-pressed="false" title="Panorama 360° (kamera langit-langit)">Panorama</button>
    </span>
    <span class="spacer"></span>
    <a id="vnvr" class="btn" target="_blank" rel="noopener" hidden>Playback NVR</a>
    <button id="vclose" title="Tutup (Esc)">Tutup</button>
  </div>
  <div class="vbody" id="vbody"></div>
  <div class="ptz" id="ptz" hidden aria-label="Kontrol PTZ">
    <div class="pad" id="ptzpad">
      <button data-dir="upleft" aria-label="Kiri atas">↖</button>
      <button data-dir="up" aria-label="Atas">▲</button>
      <button data-dir="upright" aria-label="Kanan atas">↗</button>
      <button data-dir="left" aria-label="Kiri">◀</button>
      <span></span>
      <button data-dir="right" aria-label="Kanan">▶</button>
      <button data-dir="downleft" aria-label="Kiri bawah">↙</button>
      <button data-dir="down" aria-label="Bawah">▼</button>
      <button data-dir="downright" aria-label="Kanan bawah">↘</button>
    </div>
    <div class="row" id="ptzzf">
      <button data-dir="zoomout" aria-label="Zoom keluar">Zoom −</button>
      <button data-dir="zoomin" aria-label="Zoom masuk">Zoom +</button>
      <button data-dir="focusnear" aria-label="Fokus dekat">Fokus −</button>
      <button data-dir="focusfar" aria-label="Fokus jauh">Fokus +</button>
    </div>
    <label>Kecepatan <select id="ptzspeed"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
    <div class="pst"><label>Preset <input type="number" id="ptzpreset" min="1" max="255" value="1"></label><button id="ptzgo">Pergi</button></div>
    <div class="err" id="ptzerr" role="status"></div>
  </div>
</div>

<div id="pbview" role="dialog" aria-modal="true" aria-label="Playback rekaman">
  <div class="vbar">
    <span class="name" id="pbname">Playback rekaman</span>
    <span class="spacer"></span>
    <button id="pbclose" title="Tutup (Esc)">Tutup</button>
  </div>
  <iframe id="pbframe" title="Playback" referrerpolicy="no-referrer"></iframe>
</div>

<div id="mapview" role="dialog" aria-modal="true" aria-label="Peta denah">
  <div class="vbar">
    <select id="mapsel" aria-label="Pilih peta"></select>
    <button id="mapedit" aria-pressed="false">Ubah</button>
    <span id="mapedittools" hidden style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="mapname" placeholder="Nama peta baru" maxlength="40" aria-label="Nama peta baru">
      <button id="mapnew">+ Peta baru (PNG/JPG)</button>
      <input type="file" id="mapfile" accept="image/png,image/jpeg" hidden>
      <select id="mapcam" aria-label="Kamera yang diletakkan"></select>
      <button id="mapunplace">Lepas dari peta</button>
      <button id="mapsave">Simpan</button>
      <button id="mapdel">Hapus peta</button>
    </span>
    <span id="mapmsg" role="status"></span>
    <span class="spacer"></span>
    <button id="mapclose" title="Tutup (Esc)">Tutup</button>
  </div>
  <div id="mapstage">
    <div id="mapempty" hidden>Belum ada peta. Tekan <b>Ubah</b>, lalu <b>+ Peta baru</b> untuk mengunggah denah.</div>
    <div id="mapwrap" hidden><img id="mapimg" alt="Denah"></div>
  </div>
</div>

<script src="./config.js"></script>
<script type="module">
import {VideoRTC} from './video-rtc.js';
import {Dewarp} from './dewarp.js';

// Pemutar tanpa kontrol bawaan, tanpa suara (live view CCTV)
class CamPlayer extends VideoRTC {
  oninit() {
    super.oninit();
    this.video.controls = false;
    this.video.muted = true;
  }
}
customElements.define('cam-player', CamPlayer);

const cfg = Object.assign({
  title: 'CCTV Multiview', nvrUrl: '', bridgeUrl: '', bridgePort: 8090, nvrCam: {}, fisheye: {}, names: {}, order: [], hide: [],
  hdSuffix: '_hd', mode: 'mse,webrtc', layout: 'auto', rotateSeconds: 15, dewarpMax: 6,
}, window.MULTIVIEW_CONFIG || {});

// Mode layar: dibuka oleh CctvViewer dengan ?screen=N&screens=3&per=16&ctl=1985&reload=360
// Layar N menampilkan kamera ke-((N-1)*per+1) sampai (N*per), tetap dalam grid per-kolom, tanpa halaman.
const qp = new URLSearchParams(location.search);
const intq = (k, d, lo, hi) => { const v = parseInt(qp.get(k), 10); return v >= lo && v <= hi ? v : d; };
const wall = qp.has('screen') ? {
  screen: intq('screen', 1, 1, 16),
  screens: intq('screens', 1, 1, 16),
  per: intq('per', 16, 1, 64),
  ctl: intq('ctl', 0, 0, 65535),
  reload: intq('reload', 0, 0, 10080),       // menit; 0 = tidak dimuat ulang berkala
} : null;
if (wall) {
  wall.cols = intq('cols', Math.ceil(Math.sqrt(wall.per)), 1, 16);
  wall.rows = Math.ceil(wall.per / wall.cols);
  document.body.classList.add('wall');
}
// "auto" = NvrBridge di PC yang sama dengan halaman ini
const autoBridge = location.protocol + '//' + location.hostname + ':' + (+cfg.bridgePort || 8090) + '/';
if (cfg.nvrUrl === 'auto') cfg.nvrUrl = autoBridge;
if (cfg.bridgeUrl === 'auto') cfg.bridgeUrl = autoBridge;

const $ = (id) => document.getElementById(id);
const grid = $('grid'), notice = $('notice'), viewer = $('viewer');

// ---------- state ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('mv.' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mv.' + k, v); } catch {} },
};
const state = {
  cams: [],                 // kamera yang tampil di halaman/layar ini [{id, name, hd}]
  allCams: [],              // semua kamera dari go2rtc
  layout: store.get('layout', String(cfg.layout)),
  page: 0,
  rotate: store.get('rotate', '0') === '1',
  tiles: [],                // tile yang sedang tampil
  viewerOpen: false,
};
if (!['auto', '1', '2', '3', '4'].includes(state.layout)) state.layout = 'auto';

document.title = cfg.title;
$('title').textContent = cfg.title;
function showNvrBtn() { $('nvr').hidden = !cfg.nvrUrl; if (cfg.nvrUrl) $('nvr').href = cfg.nvrUrl; }
showNvrBtn();

// Tautan playback per kamera: nvrUrl + ?cam=<nomor kamera di NVR> (jika ada di cfg.nvrCam)
function playbackHref(id) {
  if (!cfg.nvrUrl) return null;
  const n = cfg.nvrCam[id];
  if (n === undefined || n === null || n === '') return cfg.nvrUrl;
  return cfg.nvrUrl + (cfg.nvrUrl.includes('?') ? '&' : '?') + 'cam=' + encodeURIComponent(n);
}

// ---------- daftar kamera dari go2rtc ----------
async function loadCams() {
  const res = await fetch('api/streams', {cache: 'no-store'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const names = Object.keys(await res.json());
  const hdSet = new Set(names.filter(n => n.endsWith(cfg.hdSuffix)));
  let ids = names.filter(n => !hdSet.has(n) && !cfg.hide.includes(n));
  ids.sort((a, b) => {
    const ia = cfg.order.indexOf(a), ib = cfg.order.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
    return a.localeCompare(b, undefined, {numeric: true});
  });
  return ids.map(id => ({
    id,
    name: cfg.names[id] || id,
    hd: hdSet.has(id + cfg.hdSuffix) ? id + cfg.hdSuffix : null,
  }));
}

// ---------- layout ----------
function dims(n) {
  if (wall) return [wall.cols, wall.rows];
  const L = state.layout;
  if (L === 'auto') {
    if (n <= 1) return [1, 1];
    let c = Math.min(4, Math.ceil(Math.sqrt(n)));
    if (innerWidth < innerHeight) c = Math.min(c, 2);      // layar potret (HP): maksimal 2 kolom
    return [c, Math.min(4, Math.ceil(n / c))];
  }
  return [+L, +L];
}
const perPage = () => { const [c, r] = dims(state.cams.length); return c * r; };
const pageCount = () => Math.max(1, Math.ceil(state.cams.length / perPage()));

function makePlayer(stream) {
  const p = document.createElement('cam-player');
  p.mode = cfg.mode;
  p.src = new URL('api/ws?src=' + encodeURIComponent(stream), location.href).href;
  return p;
}

function clearGrid() {
  for (const t of state.tiles) { if (t.dewarp) t.dewarp.destroy(); t.el.remove(); }   // memutus websocket
  state.tiles = [];
  grid.replaceChildren();
}

function expandIcon() {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('width', '14'); s.setAttribute('height', '14'); s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2');
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', 'M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7');
  s.append(p);
  return s;
}

function renderPage() {
  clearGrid();
  const n = state.cams.length;
  const [cols, rows] = dims(n);
  lastDims = cols + 'x' + rows;
  const pp = cols * rows;
  const pages = pageCount();
  state.page = Math.min(state.page, pages - 1);
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;

  for (const cam of state.cams.slice(state.page * pp, state.page * pp + pp)) {
    const fig = document.createElement('figure');
    fig.className = 'tile';
    fig.dataset.state = 'connecting';

    const player = makePlayer(cam.id);

    const bar = document.createElement('figcaption');
    bar.className = 'bar';
    const dot = document.createElement('span'); dot.className = 'dot';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = cam.name;
    const actions = document.createElement('span'); actions.className = 'actions';
    const big = document.createElement('button');
    big.title = 'Perbesar (klik dua kali pada gambar)';
    big.setAttribute('aria-label', 'Perbesar ' + cam.name);
    big.append(expandIcon());
    big.addEventListener('click', () => openViewer(cam));
    const pbHref = playbackHref(cam.id);
    if (pbHref) {
      const pb = document.createElement('a');
      pb.className = 'btn-mini';
      pb.href = pbHref; pb.target = '_blank'; pb.rel = 'noopener';

let retryTimer = null;
async function probeBridge() {
  // Tombol Playback/PTZ/Peta hanya muncul jika NvrBridge benar-benar menjawab.
  // Jika menjawab, nama kamera dan nomor kamera NVR dari Registrasi NVR ikut dipakai (config.js tetap lebih diutamakan).
  const base = (cfg.bridgeUrl || cfg.nvrUrl || '');
  if (!base) return;
  const root = base.replace(/[?#].*$/, '').replace(/\/?$/, '/');
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 2000);
  try {
    const r = await fetch(root + 'api/info', {cache: 'no-store', signal: ctl.signal});
    if (!r.ok) throw 0;
    $('setup').href = root + 'setup.html'; $('setup').hidden = false;
    const c = await fetch(root + 'api/cams', {cache: 'no-store', signal: ctl.signal});
    if (c.ok) {
      const j = await c.json();
      const names = Object.assign({}, cfg.names), nvrCam = Object.assign({}, cfg.nvrCam);
      for (const k of j.cams || []) {
        if (!/^cam\d+$/.test(k.id)) continue;
        if (!(k.id in cfg.names)) names[k.id] = k.name;
        if (!(k.id in cfg.nvrCam)) nvrCam[k.id] = k.cam;
      }
      cfg.names = names; cfg.nvrCam = nvrCam;

}

  if (!state.allCams.length) {
    showNotice(`<h2>Belum ada kamera</h2>
      <p>Tambahkan stream di <code>go2rtc.yaml</code> pada bagian <code>streams:</code>, lalu restart go2rtc. Setiap stream tanpa akhiran <code>${cfg.hdSuffix}</code> akan tampil sebagai satu tile.</p>`);
    updateChrome();
    if (wall) retryTimer = setTimeout(start, 10000);
    return;
  }
  renderPage();
  applyRotate();
  initBridge();
}

// ---------- kontrol mode layar ----------
if (wall) {
  $('title').textContent = cfg.title;
  $('reload').addEventListener('click', () => location.reload());
  $('panelbtn').addEventListener('click', async () => {
    if (!wall.ctl) return;
    try { await fetch('http://' + location.hostname + ':' + wall.ctl + '/panel', {method: 'POST', headers: {'X-CctvViewer': '1'}}); } catch {}
  });
  $('quit').addEventListener('click', async () => {
    if (!confirm('Tutup CctvViewer? Semua layar kamera akan berhenti.')) return;
    if (!wall.ctl) return alert('Aplikasi peluncur tidak ditemukan. Tutup dengan Alt+F4.');
    try {
      await fetch('http://' + location.hostname + ':' + wall.ctl + '/quit', {method: 'POST', headers: {'X-CctvViewer': '1'}});
    } catch { alert('Tidak bisa menghubungi aplikasi peluncur. Tutup dengan Alt+F4.'); }
  });
  // Muat ulang berkala agar tidak ada kebocoran memori setelah berhari-hari (tidak saat ada tampilan diperbesar/playback/peta)
  if (wall.reload) {
    const reloadWhenIdle = () => {
      if (state.viewerOpen || pbOpen || mapOpen) return setTimeout(reloadWhenIdle, 60000);
      location.reload();
    };
    setTimeout(reloadWhenIdle, wall.reload * 60000);
  }
  // Cegah menu klik kanan dan zoom yang tidak sengaja di kiosk
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, {passive: false});
}

start();
</script>
</body>
</html>
