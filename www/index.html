<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV Multiview</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e12;
    --panel: #12161c;
    --line: #232a33;
    --text: #e6eaf0;
    --muted: #8b95a3;
    --accent: #4cc2ff;
    --ok: #3ddc84;
    --bad: #ff5c5c;
    --warn: #f5b83d;
    --head-h: 52px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    flex: none;
    min-height: var(--head-h);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    transition: margin-top .25s ease;
  }
  body.idle header { margin-top: calc(-1 * (var(--head-h) + 20px)); }
  body.idle { cursor: none; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1 1 auto; }
  .group { display: flex; align-items: center; gap: 4px; }
  button, .btn {
    appearance: none;
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    min-height: 30px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover, .btn:hover { border-color: #3a4552; background: #181e26; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pager { font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; color: var(--muted); }

  /* ---------- Grid ---------- */
  main { flex: 1 1 auto; min-height: 0; position: relative; }
  #grid {
    position: absolute;
    inset: 0;
    display: grid;
    gap: 3px;
    padding: 3px;
  }
  .tile {
    position: relative;
    margin: 0;
    min-width: 0;
    min-height: 0;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  cam-player { display: block; width: 100%; height: 100%; }
  cam-player video { object-fit: contain; background: #000; }
  .bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: linear-gradient(#000c, #0000);
    pointer-events: none;
    font-size: 12px;
  }
  .bar .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .tile[data-state="live"] .dot { background: var(--ok); }
  .tile[data-state="down"] .dot { background: var(--bad); }
  .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; pointer-events: auto; }
  .tile:hover .actions, .tile:focus-within .actions { opacity: 1; }
  .actions button, .actions .btn-mini { padding: 2px 8px; min-height: 24px; background: #000a; font-size: 12px; }
  .actions .btn-mini { color: var(--text); border: 1px solid var(--line); border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; }
  .actions .btn-mini:hover { border-color: #3a4552; background: #181e26; }
  .msg {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--muted);
    pointer-events: none;
    font-size: 13px;
    text-align: center;
    padding: 8px;
  }
  .tile[data-state="live"] .msg { display: none; }
  .tile[data-state="down"] .msg { color: var(--bad); }

  /* ---------- Empty / error ---------- */
  #notice {
    position: absolute; inset: 0;
    display: none;
    place-items: center;
    padding: 24px;
    text-align: center;
  }
  #notice.show { display: grid; }
  #notice .box { max-width: 520px; }
  #notice h2 { margin: 0 0 8px; font-size: 18px; }
  #notice p { margin: 0 0 12px; color: var(--muted); }
  code { background: #1a2029; padding: 1px 6px; border-radius: 4px; font-size: 13px; }

  /* ---------- Viewer (tile diperbesar) ---------- */
  #viewer {
    position: fixed; inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    background: #000f;
  }
  #viewer.show { display: flex; }
  #viewer .vbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #viewer .vbar .name { font-weight: 600; }
  #viewer .vbody { flex: 1 1 auto; min-height: 0; position: relative; }
  #viewer .vbody cam-player { position: absolute; inset: 0; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }

  @media (max-width: 640px) {
    header { padding: 8px 10px; gap: 8px 10px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1 id="title">CCTV Multiview</h1>
  <span class="meta" id="count"></span>
  <span class="spacer"></span>

  <div class="group" id="layouts" role="group" aria-label="Layout">
    <button data-layout="auto" aria-pressed="false" title="Layout otomatis (A)">Auto</button>
    <button data-layout="1" aria-pressed="false" title="1 × 1 (1)">1×1</button>
    <button data-layout="2" aria-pressed="false" title="2 × 2 (2)">2×2</button>
    <button data-layout="3" aria-pressed="false" title="3 × 3 (3)">3×3</button>
    <button data-layout="4" aria-pressed="false" title="4 × 4 (4)">4×4</button>
  </div>

  <div class="group" id="pager">
    <button id="prev" aria-label="Halaman sebelumnya" title="Sebelumnya (←)">‹</button>
    <span class="pager" id="pageInfo">1/1</span>
    <button id="next" aria-label="Halaman berikutnya" title="Berikutnya (→)">›</button>
    <button id="rotate" aria-pressed="false" title="Pindah halaman otomatis (Spasi)">Otomatis</button>
  </div>

  <div class="group">
    <a id="nvr" class="btn" target="_blank" rel="noopener" hidden title="Buka web NX510 untuk playback rekaman">Playback NVR</a>
    <button id="fs" title="Layar penuh (F)">Layar penuh</button>
  </div>

  <span class="meta hide-sm" id="clock"></span>
</header>

<main>
  <div id="grid"></div>
  <div id="notice"><div class="box"></div></div>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Tampilan kamera diperbesar">
  <div class="vbar">
    <span class="dot" id="vdot"></span>
    <span class="name" id="vname"></span>
    <span class="badge" id="vquality"></span>
    <span class="spacer"></span>
    <a id="vnvr" class="btn" target="_blank" rel="noopener" hidden>Playback NVR</a>
    <button id="vclose" title="Tutup (Esc)">Tutup</button>
  </div>
  <div class="vbody" id="vbody"></div>
</div>

<script src="./config.js"></script>
<script type="module">
import {VideoRTC} from './video-rtc.js';

// Pemutar tanpa kontrol bawaan, tanpa suara (live view CCTV)
class CamPlayer extends VideoRTC {
  oninit() {
    super.oninit();
    this.video.controls = false;
    this.video.muted = true;
  }
}
customElements.define('cam-player', CamPlayer);

const cfg = Object.assign({
  title: 'CCTV Multiview', nvrUrl: '', nvrCam: {}, names: {}, order: [], hide: [],
  hdSuffix: '_hd', mode: 'mse,webrtc', layout: 'auto', rotateSeconds: 15,
}, window.MULTIVIEW_CONFIG || {});

const $ = (id) => document.getElementById(id);
const grid = $('grid'), notice = $('notice'), viewer = $('viewer');

// ---------- state ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('mv.' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mv.' + k, v); } catch {} },
};
const state = {
  cams: [],                 // [{id, name, hd}]
  layout: store.get('layout', String(cfg.layout)),
  page: 0,
  rotate: store.get('rotate', '0') === '1',
  tiles: [],                // tile yang sedang tampil
  viewerOpen: false,
};
if (!['auto', '1', '2', '3', '4'].includes(state.layout)) state.layout = 'auto';

document.title = cfg.title;
$('title').textContent = cfg.title;
if (cfg.nvrUrl) { $('nvr').href = cfg.nvrUrl; $('nvr').hidden = false; }

// Tautan playback per kamera: nvrUrl + ?cam=<nomor kamera di NVR> (jika ada di cfg.nvrCam)
function playbackHref(id) {
  if (!cfg.nvrUrl) return null;
  const n = cfg.nvrCam[id];
  if (n === undefined || n === null || n === '') return cfg.nvrUrl;
  return cfg.nvrUrl + (cfg.nvrUrl.includes('?') ? '&' : '?') + 'cam=' + encodeURIComponent(n);
}

// ---------- daftar kamera dari go2rtc ----------
async function loadCams() {
  const res = await fetch('api/streams', {cache: 'no-store'});
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const names = Object.keys(await res.json());
  const hdSet = new Set(names.filter(n => n.endsWith(cfg.hdSuffix)));
  let ids = names.filter(n => !hdSet.has(n) && !cfg.hide.includes(n));
  ids.sort((a, b) => {
    const ia = cfg.order.indexOf(a), ib = cfg.order.indexOf(b);
    if (ia !== -1 || ib !== -1) return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
    return a.localeCompare(b, undefined, {numeric: true});
  });
  return ids.map(id => ({
    id,
    name: cfg.names[id] || id,
    hd: hdSet.has(id + cfg.hdSuffix) ? id + cfg.hdSuffix : null,
  }));
}

// ---------- layout ----------
function dims(n) {
  const L = state.layout;
  if (L === 'auto') {
    if (n <= 1) return [1, 1];
    let c = Math.min(4, Math.ceil(Math.sqrt(n)));
    if (innerWidth < innerHeight) c = Math.min(c, 2);      // layar potret (HP): maksimal 2 kolom
    return [c, Math.min(4, Math.ceil(n / c))];
  }
  return [+L, +L];
}
const perPage = () => { const [c, r] = dims(state.cams.length); return c * r; };
const pageCount = () => Math.max(1, Math.ceil(state.cams.length / perPage()));

function makePlayer(stream) {
  const p = document.createElement('cam-player');
  p.mode = cfg.mode;
  p.src = new URL('api/ws?src=' + encodeURIComponent(stream), location.href).href;
  return p;
}

function clearGrid() {
  for (const t of state.tiles) t.el.remove();   // memutus websocket
  state.tiles = [];
  grid.replaceChildren();
}

function expandIcon() {
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  s.setAttribute('width', '14'); s.setAttribute('height', '14'); s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2');
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', 'M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7');
  s.append(p);
  return s;
}

function renderPage() {
  clearGrid();
  const n = state.cams.length;
  const [cols, rows] = dims(n);
  lastDims = cols + 'x' + rows;
  const pp = cols * rows;
  const pages = pageCount();
  state.page = Math.min(state.page, pages - 1);
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;

  for (const cam of state.cams.slice(state.page * pp, state.page * pp + pp)) {
    const fig = document.createElement('figure');
    fig.className = 'tile';
    fig.dataset.state = 'connecting';

    const player = makePlayer(cam.id);

    const bar = document.createElement('figcaption');
    bar.className = 'bar';
    const dot = document.createElement('span'); dot.className = 'dot';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = cam.name;
    const actions = document.createElement('span'); actions.className = 'actions';
    const big = document.createElement('button');
    big.title = 'Perbesar (klik dua kali pada gambar)';
    big.setAttribute('aria-label', 'Perbesar ' + cam.name);
    big.append(expandIcon());
    big.addEventListener('click', () => openViewer(cam));
    const pbHref = playbackHref(cam.id);
    if (pbHref) {
      const pb = document.createElement('a');
      pb.className = 'btn-mini';
      pb.href = pbHref; pb.target = '_blank'; pb.rel = 'noopener';
      pb.textContent = 'Playback';
      pb.title = 'Buka rekaman kamera ini';
      actions.append(pb);
    }
    actions.append(big);
    bar.append(dot, name, actions);

    const msg = document.createElement('div'); msg.className = 'msg'; msg.textContent = 'Menghubungkan…';

    fig.append(player, bar, msg);
    fig.addEventListener('dblclick', () => openViewer(cam));
    grid.append(fig);
    state.tiles.push({el: fig, player, msg, last: -1, moved: performance.now(), live: false});
  }
  updateChrome();
}

function updateChrome() {
  const pages = pageCount();
  $('pageInfo').textContent = `${state.page + 1}/${pages}`;
  $('prev').disabled = $('next').disabled = pages < 2;
  $('rotate').disabled = pages < 2;
  for (const b of $('layouts').children) b.setAttribute('aria-pressed', String(b.dataset.layout === state.layout));
  $('rotate').setAttribute('aria-pressed', String(state.rotate && pages > 1));
  updateCount();
}

function updateCount() {
  const total = state.cams.length;
  const live = state.tiles.filter(t => t.live).length;
  $('count').textContent = total
    ? `${total} kamera · ${live}/${state.tiles.length} tampil aktif`
    : '';
}

// ---------- status tile (gambar bergerak = aktif) ----------
function setTileState(t, s, text) {
  t.live = s === 'live';
  t.el.dataset.state = s;
  if (text) t.msg.textContent = text;
}
setInterval(() => {
  const now = performance.now();
  const watch = (t) => {
    const v = t.player.video;
    if (v && v.readyState >= 2 && v.currentTime !== t.last) {
      t.last = v.currentTime; t.moved = now;
      if (!t.live) setTileState(t, 'live');
    } else if (now - t.moved > 8000 && t.el.dataset.state !== 'down') {
      setTileState(t, 'down', 'Tidak ada sinyal');
    }
  };
  state.tiles.forEach(watch);
  if (viewerT) { watch(viewerT); $('vdot').style.background = viewerT.live ? 'var(--ok)' : 'var(--bad)'; }
  updateCount();
}, 1500);
document.addEventListener('visibilitychange', () => {
  const now = performance.now();
  for (const t of state.tiles) t.moved = now;
  if (viewerT) viewerT.moved = now;
});

// ---------- viewer ----------
let viewerT = null;
function openViewer(cam) {
  state.viewerOpen = true;
  clearGrid();                                 // hemat bandwidth dan decoder saat satu kamera dibuka
  const stream = cam.hd || cam.id;
  $('vname').textContent = cam.name;
  const vHref = playbackHref(cam.id);
  $('vnvr').hidden = !vHref;
  if (vHref) $('vnvr').href = vHref;
  $('vquality').textContent = cam.hd ? 'Stream utama' : 'Stream 2 (stream utama belum diatur)';
  const player = makePlayer(stream);
  $('vbody').replaceChildren(player);
  viewerT = {el: viewer, player, msg: {}, last: -1, moved: performance.now(), live: false};
  viewer.classList.add('show');
  $('vclose').focus();
}
function closeViewer() {
  if (!state.viewerOpen) return;
  state.viewerOpen = false;
  viewer.classList.remove('show');
  if (viewerT) viewerT.player.remove();
  viewerT = null;
  $('vbody').replaceChildren();
  renderPage();
}
$('vclose').addEventListener('click', closeViewer);

// ---------- kontrol ----------
function go(delta) {
  const pages = pageCount();
  if (pages < 2 || state.viewerOpen) return;
  state.page = (state.page + delta + pages) % pages;
  renderPage();
}
function setLayout(l) {
  if (state.viewerOpen) return;
  state.layout = l; state.page = 0;
  store.set('layout', l);
  renderPage();
}
$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
$('layouts').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setLayout(b.dataset.layout); });

let rotateTimer = null;
function applyRotate() {
  clearInterval(rotateTimer);
  if (state.rotate && pageCount() > 1) {
    rotateTimer = setInterval(() => go(1), Math.max(3, +cfg.rotateSeconds || 15) * 1000);
  }
  updateChrome();
}
$('rotate').addEventListener('click', () => {
  state.rotate = !state.rotate;
  store.set('rotate', state.rotate ? '1' : '0');
  applyRotate();
});
// Mengganti layout bisa mengubah jumlah halaman, jadi jadwal putar ikut diperbarui
$('layouts').addEventListener('click', applyRotate);

$('fs').addEventListener('click', toggleFs);
function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') return closeViewer();
  switch (e.key) {
    case 'ArrowLeft': go(-1); break;
    case 'ArrowRight': go(1); break;
    case 'a': case 'A': setLayout('auto'); applyRotate(); break;
    case '1': case '2': case '3': case '4': setLayout(e.key); applyRotate(); break;
    case 'f': case 'F': toggleFs(); break;
    case ' ': if (!e.target.closest('button, a')) { e.preventDefault(); $('rotate').click(); } break;
  }
});

// Header menyembunyikan diri saat layar penuh dan mouse diam (untuk monitor dinding)
let idleTimer = null;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  if (document.fullscreenElement) idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}
document.addEventListener('mousemove', wake);
document.addEventListener('fullscreenchange', wake);

// Layout auto menyesuaikan orientasi layar
let resizeTimer = null, lastDims = '';
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const key = dims(state.cams.length).join('x');
    if (key !== lastDims && state.cams.length && !state.viewerOpen) { renderPage(); applyRotate(); }
  }, 300);
});

// Jam
const fmt = new Intl.DateTimeFormat('id-ID', {dateStyle: 'medium', timeStyle: 'medium'});
const tick = () => { $('clock').textContent = fmt.format(new Date()); };
tick(); setInterval(tick, 1000);

// ---------- mulai ----------
function showNotice(html) {
  notice.querySelector('.box').innerHTML = html;
  notice.classList.add('show');
}
async function start() {
  notice.classList.remove('show');
  try {
    state.cams = await loadCams();
  } catch (err) {
    showNotice(`<h2>Tidak bisa menghubungi go2rtc</h2>
      <p>Buka halaman ini lewat alamat go2rtc, misalnya <code>http://IP-SERVER:1984/</code>, bukan dari file HTML langsung. Pastikan go2rtc berjalan.</p>
      <button id="retry">Coba lagi</button>`);
    $('retry').addEventListener('click', start);
    return;
  }
  if (!state.cams.length) {
    showNotice(`<h2>Belum ada kamera</h2>
      <p>Tambahkan stream di <code>go2rtc.yaml</code> pada bagian <code>streams:</code>, lalu restart go2rtc. Setiap stream tanpa akhiran <code>${cfg.hdSuffix}</code> akan tampil sebagai satu tile.</p>`);
    updateChrome();
    return;
  }
  renderPage();
  applyRotate();
}
start();
</script>
</body>
</html>
